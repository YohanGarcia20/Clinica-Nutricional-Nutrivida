<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="assets/logoNutriVida.jfif" alt="Logo NutriVida" width="40" height="40">
                NutriVida
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="registro.html">Registrar usuario</a></li>
                    <li class="nav-item"><a class="nav-link" href="misServicios.html">Mis productos (<span
                                id="contador-carrito">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <section class="formulario-contacto d-flex justify-content-center">
            <div class="login-box text-center" style="max-width: 500px; width: 100%;">
                <img src="assets/logoNutriVida.jfif" alt="logo NutriVida" width="100" height="100">
                <h1>NutriVida</h1>
                <p>Contáctanos</p>

                <form class="text-start">
                    <div class="campo-formulario mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100" required>
                    </div>

                    <div class="campo-formulario mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="correo" name="correo" maxlength="100">
                    </div>

                    <div class="campo-formulario mb-3">
                        <label for="comentario" class="form-label">Comentario</label>
                        <textarea class="form-control" id="comentario" name="comentario" maxlength="500"
                            required></textarea>
                    </div>

                    <button type="submit" class="btn btn-nutrivida w-100">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-white py-4 mt-4">
        <div class="container d-flex flex-wrap justify-content-between">
            <div>
                <p class="mb-0">NutriVida — Clínica Nutricional</p>
                <p class="mb-0">Temuco, Región de La Araucanía</p>
            </div>
            <nav class="d-flex gap-3">
                <a href="servicios.html">Servicios</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
