<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriVida - Clínica Nutricional</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <div id="logo-image">
            <img src="assets/logoNutriVida.jfif" alt="Logo NutriVida" width="100" height="100">
            <span id="logo-text">NutriVida</span>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <div class="user-acciones">
                <ul>
                    <li><a href="login.html">Iniciar sesión</a></li>
                    <li><a href="registro.html">Registrar usuario</a></li>
                    <li><a href="misServicios.html" class="cart-icon">Mis productos</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="formulario-contacto">
            <div class="login-box">
                <img src="assets/logoNutriVida.jfif" alt="logo NutriVida" width="100" height="100">
                <h1>NutriVida</h1>
                <p>Contáctanos</p>

                <form>
                    <div class="campo-formulario">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" maxlength="100">
                    </div>

                    <div class="campo-formulario">
                        <label for="comentario">Comentario</label>
                        <textarea id="comentario" name="comentario" maxlength="500" required></textarea>
                    </div>

                    <button type="submit">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-info">
            <p>NutriVida — Clínica Nutricional</p>
            <p>Temuco, Región de La Araucanía</p>
        </div>
        <nav class="footer-links">
            <a href="servicios.html">Servicios</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <form class="newsletter">
            <label for="email-news">Recibe consejos de nutrición:</label>
            <input type="email" id="email-news" name="email-news" placeholder="Ingresa tu correo" required>
            <button type="submit">Suscribirse</button>
        </form>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
