<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <div id="logo-image">
            <img src="assets/logoNutriVida.jfif" alt="Logo NutriVida" width="100" height="100">
            <span id="logo-text">NutriVida</span>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servicios.html">Servicios</a></li>

                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>

            <div class="user-acciones">
                <ul>
                    <li><a href="login.html">Iniciar sesión</a></li>
                    <li><a href="registro.html">Registrar usuario</a></li>
                    <li><a href="productos.html" class="cart-icon">Mis productos</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section class="formulario-login">
            <div class="login-box">
                <img src="assets/logoNutriVida.jfif" alt="logo NutriVida" width="100" height="100">
                <h1>NutriVida</h1>

                <form>
                    <div class="input-group mb-3">
  
  <input type="text" class="form-control" placeholder="Nombre" aria-label="Username" aria-describedby="basic-addon1">
</div>

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Apellido" aria-label="Recipient’s username" aria-describedby="basic-addon2">
  <span class="input-group-text" id="basic-addon2"></span>
</div>

<div class="mb-3">
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Correo" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
  </div>
  

<div class="input-group mb-3">
  <input type="text" class="form-control" placeholder="Contraseña" aria-label="Amount (to the nearest dollar)">
</div>

                    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                </form>
            </div>
        </section>






    <footer>
        <div class="footer-info">

            <a href="contacto.html">Contacto</a>

        <form class="newsletter">
            <label for="email-news">Recibe consejos de nutrición:</label>

            <button type="submit">Suscribirse</button>
        </form>
    </footer>
